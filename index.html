<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sengoku Clash</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#120d16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sengoku Clash">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
  html,body{margin:0;height:100%;background:#120d16;color:#eee;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center}
  #stage{position:relative;width:min(100vw,calc((100dvh - 92px)*16/9));aspect-ratio:16/9}
  canvas#game{width:100%;height:100%;display:block;image-rendering:pixelated;background:#000;touch-action:none}
  #cards{display:flex;gap:5px;padding:6px;justify-content:center;height:84px;box-sizing:border-box;width:100%}
  .card{position:relative;width:76px;height:72px;background:#2a2234;border:2px solid #5a4a6a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;cursor:pointer;overflow:hidden;flex:0 1 76px;min-width:0}
  .card canvas{width:68px;height:39px;image-rendering:pixelated}
  .card .nm{font-weight:700;font-size:10px;white-space:nowrap}
  .card .cost{color:#ffd86b;font-weight:700}
  .card .key{position:absolute;top:1px;left:4px;color:#9a8aaa;font-size:10px}
  .card .cd{position:absolute;left:0;bottom:0;width:100%;height:0;background:rgba(0,0,0,.6);pointer-events:none}
  .card.off{opacity:.5}
  .card.locked{opacity:.4;filter:grayscale(1)}
  .card.special{border-color:#c9a24a}
  .card.order{flex:0 1 54px;width:54px;border-color:#4f7aa8}
  .card.order.act{background:#2f4f86;border-color:#fff}
  .card.order .ico{font-size:20px}
  #touch{position:absolute;inset:0;pointer-events:none;display:none}
  .tb{position:absolute;pointer-events:auto;width:60px;height:60px;border-radius:50%;background:rgba(20,14,28,.55);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:21px;display:flex;align-items:center;justify-content:center;touch-action:none}
  .tb.sm{width:42px;height:42px;font-size:14px;border-radius:10px}
  .tb:active{background:rgba(255,200,80,.5)}
  #overlay{position:absolute;inset:0;background:rgba(10,6,16,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;box-sizing:border-box;z-index:5;overflow:auto}
  #overlay.clear{background:rgba(10,6,16,.5)}
  #overlay h1{margin:0 0 4px;font-size:clamp(26px,6vw,58px);letter-spacing:4px;color:#ffd86b;text-shadow:0 4px 0 #7a2a2a}
  #overlay h2{margin:0 0 4px;font-size:clamp(16px,2.6vw,26px);color:#ffd86b}
  #overlay p{margin:4px 0;max-width:760px;font-size:clamp(11px,1.6vw,15px);line-height:1.4;color:#ddd}
  #overlay .keys{color:#aaa;font-size:clamp(10px,1.4vw,13px)}
  .btns{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:#b02a2a;border:2px solid #ffd86b;color:#fff;font-weight:800;padding:9px 18px;border-radius:8px;cursor:pointer;font-size:clamp(12px,1.8vw,15px)}
  .btn:hover{background:#d03a3a}
  .btn.alt{background:#2f4f86}
  .btn.sel{outline:3px solid #fff}
  .btn.small{padding:5px 12px;font-size:12px}
  .btn.dim{background:#3a3344;border-color:#6a5a7a;color:#bbb}
  .btn.off{opacity:.45;cursor:not-allowed}
  .start{font-size:clamp(18px,3.4vw,32px);letter-spacing:5px;font-weight:900;color:#fff;margin-top:18px;cursor:pointer;animation:blink 1.2s infinite;text-shadow:0 2px 0 #000}
  @keyframes blink{50%{opacity:.3}}
  .sub{color:#e8c8a0;letter-spacing:3px;font-size:clamp(11px,1.8vw,16px);margin-bottom:4px}
  .mapwrap{width:min(94%,860px)}
  .xbtn{position:sticky;top:0;align-self:flex-start;z-index:6;background:#3a2a18;border:2px solid #ffd86b;color:#ffd86b;font-weight:800;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer;margin:0 0 4px}
  .btns.act{position:sticky;bottom:0;z-index:6;background:rgba(10,6,16,.94);padding:6px;margin-top:6px;width:100%;box-sizing:border-box}
  @media (max-height:520px){.mapwrap svg{max-height:calc(100dvh - 255px);width:auto;max-width:100%;margin:0 auto}.mapwrap .brief{font-size:12px}}
  .mapwrap svg{width:100%;height:auto;display:block;border:3px solid #6a4a2a;border-radius:10px;background:#e2cf9b}
  .brief{margin-top:6px;font-size:clamp(11px,1.6vw,14px);line-height:1.35;color:#eee}
  .brief b{color:#ffd86b}
  .vet{font-size:11px;color:#cbb36a;margin-top:2px}
  .nd{cursor:pointer}
  .pulse{animation:pulse 1.1s infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{transform:scale(1.18)}}
  .help{max-width:640px;width:92%;background:rgba(30,22,40,.9);border:2px solid #6a4a8a;border-radius:12px;padding:12px 16px;text-align:left}
  .help h3{margin:0 0 6px;color:#ffd86b;font-size:clamp(15px,2.4vw,22px)}
  .help li,.help div.t{font-size:clamp(11px,1.6vw,15px);line-height:1.45;margin:3px 0;color:#eee}
  .help ul{margin:4px 0;padding-left:20px}
  .help kbd{background:#3a3050;border:1px solid #7a6a9a;border-radius:4px;padding:0 5px;font-size:.9em}
  .dots{margin-top:8px;color:#8a7aaa;letter-spacing:5px}
  .shop{width:min(94%,640px);text-align:left}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(40,30,56,.85);border:1px solid #6a4a8a;border-radius:8px;padding:6px 10px;margin:5px 0;font-size:clamp(11px,1.6vw,14px)}
  .row b{color:#ffd86b}
  .row small{color:#b8a8d0;display:block}

  .tb[data-act=left]{left:12px;bottom:12px}
  .tb[data-act=right]{left:80px;bottom:12px}
  .tb[data-act=up]{left:12px;bottom:78px}
  .tb[data-act=down]{left:80px;bottom:78px}
  .tb[data-act=atk]{right:12px;bottom:12px}
  .tb[data-act=block]{right:80px;bottom:12px}
  .tb[data-act=dodge]{right:46px;bottom:78px}
  .tb[data-act=special]{right:114px;bottom:78px}
  .tb[data-act=prev]{right:112px;top:56px}
  .tb[data-act=next]{right:60px;top:56px}
  .tb[data-act=gen]{right:8px;top:56px}
  .tb[data-act=peek]{right:164px;top:56px}
  #dpad{position:absolute;left:14px;bottom:14px;width:138px;height:138px;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none;opacity:.8}
  #dpad .arm{position:absolute;background:#2a2236;border:2px solid #6a5a8a;box-sizing:border-box}
  #dpad .arm.u,#dpad .arm.d{left:37px;width:64px;height:55px}
  #dpad .arm.l,#dpad .arm.r{top:37px;height:64px;width:55px}
  #dpad .arm.u{top:0;border-radius:12px 12px 0 0;border-bottom:0}
  #dpad .arm.d{bottom:0;border-radius:0 0 12px 12px;border-top:0}
  #dpad .arm.l{left:0;border-radius:12px 0 0 12px;border-right:0}
  #dpad .arm.r{right:0;border-radius:0 12px 12px 0;border-left:0}
  #dpad .hub{position:absolute;left:37px;top:37px;width:64px;height:64px;background:#2a2236;border:0}
  #dpad .hub:after{content:"";position:absolute;left:20px;top:20px;width:24px;height:24px;border-radius:50%;background:#1a1424;border:2px solid #4a3a6a;box-sizing:border-box}
  #dpad .ar{position:absolute;font-style:normal;color:#8a7aaa;font-size:16px;line-height:1;pointer-events:none}
  #dpad .ar.u{left:62px;top:12px}#dpad .ar.d{left:62px;bottom:12px}#dpad .ar.l{left:12px;top:60px}#dpad .ar.r{right:12px;top:60px}
  #dpad .arm.on{background:#5a4a86;border-color:#ffd86b}
  @media (max-height:520px){#dpad{width:112px;height:112px;left:10px;bottom:10px}
    #dpad .arm.u,#dpad .arm.d{left:30px;width:52px;height:44px}#dpad .arm.l,#dpad .arm.r{top:30px;height:52px;width:44px}
    #dpad .hub{left:30px;top:30px;width:52px;height:52px}#dpad .hub:after{left:15px;top:15px}
    #dpad .ar.u{left:50px;top:9px}#dpad .ar.d{left:50px;bottom:9px}#dpad .ar.l{left:9px;top:48px}#dpad .ar.r{right:9px;top:48px}}
  .tb[data-act=pause]{left:8px;top:140px}
  #rot{display:none;position:fixed;top:0;left:0;right:0;background:#b02a2a;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px;z-index:20;pointer-events:none}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:block}}
  @media (max-height:520px),(max-width:760px){
    #cards{height:58px;padding:3px;gap:3px}
    .card{height:50px;flex:1 1 0;max-width:56px;min-width:0;border-width:1px;border-radius:6px;width:auto}
    .card canvas{width:40px;height:23px}
    .card .nm{display:none}
    .card .key{font-size:9px;left:3px}
    .card .cost{font-size:10px}
    .card div[style*="font-size"]{font-size:16px!important}
    .card.order .ico{font-size:15px}
  }
  @media (max-height:520px){
    #stage{width:min(100vw,calc((100dvh - 62px)*16/9))}
    .tb{width:50px;height:50px;font-size:18px}
    .tb.sm{width:38px;height:38px;font-size:13px}
    .tb[data-act=left]{left:8px;bottom:8px}
    .tb[data-act=right]{left:62px;bottom:8px}
    .tb[data-act=up]{left:8px;bottom:62px}
    .tb[data-act=down]{left:62px;bottom:62px}
    .tb[data-act=atk]{right:8px;bottom:8px}
    .tb[data-act=block]{right:62px;bottom:8px}
    .tb[data-act=dodge]{right:35px;bottom:62px}
    .tb[data-act=special]{right:89px;bottom:62px}
    .tb[data-act=gen]{right:6px;top:50px}
    .tb[data-act=next]{right:48px;top:50px}
    .tb[data-act=prev]{right:90px;top:50px}
    .tb[data-act=peek]{right:132px;top:50px}
  }

  .slots{display:flex;gap:8px;justify-content:center;margin:6px 0;flex-wrap:wrap}
  .slot{width:84px;height:72px;background:#2a2234;border:2px solid #6a5a8a;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px}
  .slot.pick{border-color:#ffd86b;animation:blink 1s infinite}
  .slot canvas{width:70px;height:40px;image-rendering:pixelated}
  .slot .plus{font-size:24px;color:#6a5a8a}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(96%,780px);margin:6px 0}
  .ucard{background:rgba(40,30,56,.9);border:2px solid #6a4a8a;border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:12px}
  .ucard canvas{width:84px;height:48px;image-rendering:pixelated}
  .ucard small{color:#b8a8d0;font-size:10px;line-height:1.25}
  .ucard .st{margin-top:3px;font-weight:700;font-size:11px}
  .ucard.eq{border-color:#7af7e6}.ucard.eq .st{color:#7af7e6}
  .ucard.locked{opacity:.55;cursor:default}.ucard.locked canvas{filter:brightness(0) opacity(.6)}
  .ucard.buy{border-color:#ffd86b}.ucard.buy .st{color:#ffd86b}
  .ucard.poor{opacity:.7}
  .ucard.pend{border-color:#ffd86b;animation:blink 1s infinite}
  @media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
  #overlay{justify-content:flex-start}
  #overlay>:first-child{margin-top:auto}
  #overlay>:last-child{margin-bottom:auto}

  .hdr{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:4px}
  .hdr h2{margin:0}
  .mini{width:210px;cursor:pointer}
  .mini svg{width:100%;height:auto;display:block;border:2px solid #6a4a8a;border-radius:6px}
  .wsvg{width:100%;height:auto;display:block;border:3px solid #3a5a7a;border-radius:10px}
  #wrap{box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{max-width:100%}
  .pwa-row{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;font-size:12px;color:#cbb8e0}
</style>
</head>
<body>
<div id="rot">📱 Turn your phone sideways for the best view</div>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="touch">
      <div id="dpad"><div class="arm u"></div><div class="arm d"></div><div class="arm l"></div><div class="arm r"></div><div class="hub"></div>
        <i class="ar u">▲</i><i class="ar d">▼</i><i class="ar l">◀</i><i class="ar r">▶</i></div>
      <div class="tb" data-act="atk">⚔</div>
      <div class="tb" data-act="block">🛡</div>
      <div class="tb" data-act="dodge">💨</div>
      <div class="tb" data-act="special">✦</div>
      <div class="tb sm" data-act="prev">Q</div>
      <div class="tb sm" data-act="next">E</div>
      <div class="tb sm" data-act="gen">G</div>
      <div class="tb sm" data-act="peek">👁</div>
      <div class="tb sm" data-act="pause">❚❚</div>
    </div>
    <div id="overlay"></div>
  </div>
  <div id="cards"></div>
</div>

REGIONS.forEach((R, ri) => {
  R.start = STAGES.length; R.n = R.stages.length;
  R.stages.forEach((st, li) => {
    st.region = ri; st.local = li; st.g = STAGES.length;
    st.pow = st.g < 10 ? st.g : 9 + (st.g - 9) * 0.28;
    if (st.g >= 10) {
      st.lvl = Math.min(19, Math.round(11 + (st.pow - 9) * 0.5));
      st.w = Math.min(8000, 6000 + 40 * st.g);
      st.bossLvl = Math.round(st.lvl * 0.5) + 1;
    } else st.bossLvl = 5;
    st.inc = st.pow <= 9 ? 4.2 + 1.1 * st.pow : 14.1 + 0.5 * (st.pow - 9);
    STAGES.push(st);
  });
  R.end = STAGES.length;
});

let AC = null, muted = false, noiseBuf = null;
const mus = { timer: null, step: 0, next: 0, mode: 'calm' };
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    mus.next = AC.currentTime + 0.2;
    mus.timer = setInterval(musicTick, 100);
  } catch (e) { AC = null; }
}
function sfx(f, d, type = 'square', v = 0.04, slide = 0) {
  if (muted || !AC) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), AC.currentTime + d);
    g.gain.value = v; g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
function tone(f, t, d, type, v, slideTo) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

}

  const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 1800;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t + d);
}
const PENT = [0, 3, 5, 7, 10];
const MELODY_A = [0, 2, 3, 2, 4, 3, 2, 0, 1, 2, 3, 4, 3, 2, 1, 0];
function musicTick() {
  if (!AC) return;
  if (muted) { mus.next = Math.max(mus.next, AC.currentTime + 0.1); return; }
  const m = mus.mode;
  const bpm = m === 'boss' ? 138 : m === 'battle' ? 116 : 84;
  const spb = 60 / bpm / 2;
  while (mus.next < AC.currentTime + 0.35) {
    const t = mus.next, st = mus.step;
    const root = 146.83 * (m === 'boss' ? 0.84 : 1);
    if (m !== 'calm') {
      if (st % 4 === 0) tone(95, t, 0.22, 'sine', 0.13, 42);
      if (st % 8 === 4) noiseHit(t, 0.1, 0.05);
      if (m === 'boss' && st % 2 === 1) tone(70, t, 0.1, 'sine', 0.06, 45);
      if (m === 'battle' && st % 8 === 6) tone(120, t, 0.12, 'sine', 0.07, 60);
    } else if (st % 8 === 0) tone(80, t, 0.3, 'sine', 0.06, 50);
    if (st % 16 === 0) tone(root / 2, t, spb * 7, 'sawtooth', 0.025);
    if (st % 16 === 8) tone(root / 2 * Math.pow(2, 7 / 12), t, spb * 7, 'sawtooth', 0.02);
    const play = m === 'calm' ? (st % 2 === 0) : (st % 2 === 0 || (m === 'boss' && Math.random() < 0.5));
    if (play) {
      let idx = MELODY_A[(st >> 0) % MELODY_A.length];
      if (m !== 'calm' && Math.random() < 0.3) idx = (idx + 1 + (Math.random() * 2 | 0)) % 5;
      const semi = PENT[idx % 5] + (m === 'boss' ? 0 : 0);
      const f = root * 2 * Math.pow(2, semi / 12) * (st % 32 >= 16 ? 1.5 : 1);
      tone(f, t, spb * 1.8, 'triangle', m === 'calm' ? 0.035 : 0.045);
      tone(f * 2.01, t, spb * 0.6, 'sine', 0.012);
    }
    mus.next += spb; mus.step++;
  }
}

function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function makeLayer(f, color, base, amp, seed, peaky, trees) {
  const w = Math.ceil(VW + (WW - VW) * f);

  const x = c.getContext('2d');

  for (let i = 0; i <= w; i += 6) {
    const y = base - (Math.sin(i * 0.004 + seed) * amp + Math.sin(i * 0.011 + seed * 2) * amp * 0.4 + (peaky ? Math.abs(Math.sin(i * 0.0021 + seed)) * amp * 1.3 : 0));
    x.lineTo(i, y);

  x.lineTo(w, VH); x.closePath(); x.fill();

    x.fillStyle = color;

      x.beginPath(); x.moveTo(i + 2, ty - th * 0.4); x.lineTo(i + 9, ty - th * 1.15); x.lineTo(i + 16, ty - th * 0.4); x.fill();

  return b.hp * (1 + 0.14 * u.lvl) * (u.team ? G.diff.hp : 1) * shogunBonus(u);
}
function dmgOf(u) {
  const b = UNITS[u.type];
  return b.dmg * (1 + 0.16 * u.lvl) * (u.ctrl ? 1.35 : 1) * (u.buffT > 0 ? 1.3 : 1) * (u.team ? G.diff.dmg : 1) * shogunBonus(u);
}
function spdOf(u) {
  const b = UNITS[u.type];
  return b.spd * (1 + 0.04 * u.lvl) * (u.ctrl ? 1.1 : 1) * (u.buffT > 0 ? 1.2 : 1) * (u.enraged ? 1.25 : 1) * (u.slowT > 0 ? 0.5 : 1) * (G.stage.slow || 1);
}
function atkTime(u) {
  const b = UNITS[u.type];
  return Math.max(0.28, b.atk * (1 - 0.03 * u.lvl) * (u.ctrl ? 0.9 : 1) * (u.enraged ? 0.8 : 1));
}
function need(l) { return 25 + l * 18; }

function gainXP(u, n) {
  if (u.team !== 0 || u.dead || u.lvl >= MAX_LVL) return;
  u.xp += n;
  while (u.lvl < MAX_LVL && u.xp >= need(u.lvl)) {
    u.xp -= need(u.lvl);
    const oldTier = tierOf(u.lvl);
    u.lvl++;
    const old = u.maxhp;
    u.maxhp = hpMax(u);
    u.hp = Math.min(u.maxhp, u.hp + (u.maxhp - old) + u.maxhp * 0.3);
    floatText(u.x, GY + u.ly - 120, 'LEVEL ' + u.lvl + '!', '#ffd86b', 1.4);
    sfx(520, 0.12, 'square', 0.05); setTimeout(() => sfx(780, 0.16, 'square', 0.05), 90);
    if (u.lvl > G.maxLvl) G.maxLvl = u.lvl;
    if (u.lvl > (G.best[u.type] || 0)) G.best[u.type] = u.lvl;
    for (let i = 0; i < 14; i++) spark(u.x, GY + u.ly - 40, '#ffd86b');
    if (tierOf(u.lvl) > oldTier) {
      const t = tierOf(u.lvl);
      floatText(u.x, GY + u.ly - 142, 'NEW WEAPON!', TIER_COL[t], 1.8);
      banner('Weapon forged: ' + weaponName(u));
      for (let i = 0; i < 30; i++) spark(u.x, GY + u.ly - 50, TIER_COL[t]);
      G.shake = Math.max(G.shake, 4);
      setTimeout(() => { sfx(660, 0.1, 'triangle', 0.06); sfx(990, 0.25, 'triangle', 0.06); }, 150);
    }
  }
}

function enemiesOf(u) { return G.units.filter(e => e.team !== u.team && !e.dead); }
function alliesOf(t) { return G.units.filter(e => e.team === t && !e.dead); }
function pop(t) { return G.units.filter(e => e.team === t && !e.dead && !isGen(e) && !e.summoned).length; }

function floatText(x, y, text, col, life = 0.9) {
  if (G.texts.length > 60) G.texts.shift();
  G.texts.push({ x, y, text, col, t: 0, life });
}
function spark(x, y, col) {
  G.parts.push({ x, y, vx: rand(-160, 160), vy: rand(-200, 40), t: 0, life: rand(0.25, 0.5), col });
}
function banner(text) { G.banner = { text, t: 0 }; }

function setCtrl(u) {
  if (!u || u.dead) return;
  if (G.ctrl && G.ctrl !== u) {
    G.ctrl.ctrl = false;
    if (G.ctrl.state === 'block') G.ctrl.state = 'idle';
  }
  G.ctrl = u; u.ctrl = true;
  sfx(300, 0.06, 'triangle', 0.05);
}
function fallbackCtrl(near) {
  if (!G.gen[0].dead) { setCtrl(G.gen[0]); return; }
  let best = null, bd = 1e9;
  for (const u of G.units) {
    if (u.team !== 0 || u.dead) continue;
    const d = Math.abs(u.x - near);
    if (d < bd) { bd = d; best = u; }
  }
  if (best) setCtrl(best);
}
function cycle(dir) {
  const list = G.units.filter(u => u.team === 0 && !u.dead && !isGen(u)).sort((a, b) => a.x - b.x);
  if (!list.length) { fallbackCtrl(0); return; }
  let i = list.indexOf(G.ctrl);
  if (i < 0) i = dir > 0 ? -1 : 0;
  i = (i + dir + list.length) % list.length;
  setCtrl(list[i]);
}

// ------------------------------------------------------------------ spawning
function canSpawn(team, type) {
  const b = UNITS[type];
  if (team === 0) {
    if (!unlocked(type)) return false;
    if (G.koku[0] < b.cost) return false;
    if ((G.cds[type] || 0) > 0) return false;
  } else if (G.koku[1] < b.cost) return false;
  return pop(team) < MAX_POP;
}
function spawn(team, type) {
  if (!canSpawn(team, type)) return false;
  const b = UNITS[type];
  G.koku[team] -= b.cost;
  const lvl = team === 0 ? startLvl(type) : G.stage.lvl + (Math.random() < 0.35 ? 1 : 0);
  const u = mk(type, team, G.gen[team].homeX + (team ? -1 : 1) * (50 + rand(0, 20)), lvl);
  if (team === 0 && lvl > (G.best[type] || 0)) G.best[type] = lvl;
  G.units.push(u);
  if (team === 0) { G.cds[type] = b.cd * (1 - 0.08 * upLvl('drill')); sfx(330, 0.08, 'triangle', 0.05); }
  for (let i = 0; i < 6; i++) spark(u.x, GY + u.ly - 20, team ? '#6aa0ff' : '#ff8a70');
  return true;
}
function summonUnits(team, type, n, x, life) {
  for (let i = 0; i < n; i++) {
    const g = mk(type, team, x + (team ? -1 : 1) * (50 + i * 28), G.stage.lvl);
    g.summoned = true;
    if (life) { g.life = life; g.clone = true; }
    G.units.push(g);
    for (let k = 0; k < 8; k++) spark(g.x, GY + g.ly - 30, '#c070ff');

}

// ------------------------------------------------------------------ castles
const castleEdge = (c, u) => Math.max(0, Math.abs(u.x - c.x) - CASTLE_HALF);
function damageCastle(c, dmg, att) {
  if (c.dead || G.over) return;
  c.hp -= dmg; c.flash = 0.1;
  const sx = att ? c.x + Math.sign(att.x - c.x) * CASTLE_HALF : c.x;
  floatText(sx, GY - 60 + rand(-20, 20), String(Math.round(dmg)), '#ffcf8a', 0.5);

  if (c.hp <= 0) {

    G.over = c.team === 1 ? 'win' : 'lose'; G.overT = 0; G.focusX = c.x; G.shake = 18;

    banner(c.team === 1 ? 'THE ENEMY CASTLE FALLS!' : 'YOUR CASTLE HAS FALLEN!');
  }
}

// ------------------------------------------------------------------ combat
function startAttack(u, special, dur) {
  u.state = 'attack'; u.t = 0; u.hitIdx = 0; u.special = special || null; u.atkT = dur || atkTime(u);
}
function startDash(u, spd, dur, mult, inv) {

}
function hitCastleWith(u, dmg, reach) {
  const ec = G.castle[1 - u.team];

  if ((ec.x - u.x) * u.face > 0 && castleEdge(ec, u) <= reach + 10) { damageCastle(ec, dmg * 0.8, u); if (u.ctrl) gainXP(u, 2); return true; }

}
function muzzle(u) {

}
function strike(u) {

  if (b.ranged) {
    const pj = PROJ[u.type] || PROJ.archer;
    G.arrows.push({ x: u.x + u.face * (pj.kind === 'bullet' ? 44 : 26), y: GY + u.ly - 46, ly: u.ly, vx: u.face * pj.vx, team: u.team, dmg, life: pj.life, owner: u, tier: spriteTier(u), kind: pj.kind, hw: pj.hw });
    if (pj.kind === 'bullet') muzzle(u);

  }
  sfx(240, 0.05, 'sawtooth', 0.03, -120);
  const sc = unitScale(u);
  G.fx.push({ x: u.x + u.face * 34 * sc, y: GY + u.ly - 44 * sc, face: u.face, t: 0, life: 0.14, big: b.sweep, tier: spriteTier(u), sc });
  const reach = rangeOf(u);
  let list = enemiesOf(u).filter(e => { const d = (e.x - u.x) * u.face; return d >= -14 && d <= reach + 14 && Math.abs(e.ly - u.ly) <= LANE_HIT; });
  if (!b.sweep && list.length > 1) {
    list.sort((a, c) => Math.abs(a.x - u.x) - Math.abs(c.x - u.x));
    list = [list[0]];
  }

  for (const e of list) if (hit(u, e, dmg, u.face * 160, u.x, true)) landed = true;
  if (hitCastleWith(u, dmg, reach)) landed = true;

}
function specialHit(u, i) {

      for (const e of foes) { const dx = (e.x - u.x) * u.face; if (dx >= -14 && dx <= reach + 70 && Math.abs(e.ly - u.ly) <= LANE_HIT) if (hit(u, e, d * 2, u.face * 320, u.x, true)) landed++; }

      }

    case 'whirl':

      for (const e of foes) if (Math.abs(e.x - u.x) < 115 && Math.abs(e.ly - u.ly) <= LANE_HIT + 10) if (hit(u, e, d * 1.8, kbOut(e), u.x, true)) landed++;
      { const ec = G.castle[1 - u.team]; if (!ec.dead && castleEdge(ec, u) <= 90) { damageCastle(ec, d * 1.8 * 0.8, u); landed++; } }

      { let list = foes.filter(e => { const dx = (e.x - u.x) * u.face; return dx >= -14 && dx <= reach + 30 && Math.abs(e.ly - u.ly) <= LANE_HIT; });

      }
      { const ec = G.castle[1 - u.team]; if (!ec.dead && castleEdge(ec, u) <= 110) { damageCastle(ec, d * 2 * 0.8, u); landed++; } }
      G.shake = 9; sfx(70, 0.4, 'sawtooth', 0.09, -25);

      break;
    case 'smoke': {

      list.sort((a, c) => Math.abs(a.x - u.x) - Math.abs(c.x - u.x));

      }

function burn(u, d) {
  if (u.dead || u.iT > 0) return;
  u.hp -= d; u.flash = 0.06;
  if (Math.random() < 0.3) floatText(u.x + rand(-8, 8), GY + u.ly - 80, String(Math.round(d)), '#ff9a3a', 0.45);

}
function hit(att, tg, dmg, kb, fromX, melee) {

    if (tg.ctrl) { gainXP(tg, 8); floatText(tg.x, GY + tg.ly - 110, 'DODGE', '#8ef', 0.6); save.stats.dodges++; dirty = true; }
    return false;
  }

  if (!front && melee && att && att.type === 'ninja') { dmg *= 1.35; if (Math.random() < 0.5) floatText(tg.x, GY + tg.ly - 120, 'BACKSTAB', '#ff7a8a', 0.7); }
  if (tg.state === 'block' && front) {
    if (tg.blockT < 0.22) {

      save.stats.parries++; dirty = true;

    sfx(420, 0.06, 'square', 0.04);
    gainXP(tg, 3);
    tg.kb = -tg.face * 40;
  }
  if (tg.ctrl) dmg *= 0.85;
  if (tg.armorT > 0) dmg *= 0.5;

  floatText(tg.x + rand(-8, 8), GY + tg.ly - 92 * unitScale(tg), String(Math.round(dmg)), tg.team ? '#fff' : '#ff9a8a', 0.6);
  for (let i = 0; i < 5; i++) spark(tg.x, GY + tg.ly - 42, '#ffe');
  sfx(150, 0.06, 'square', 0.05, -60);
  if (att && att.ctrl) G.hs = Math.max(G.hs, 0.04);
  if (tg.ctrl) G.hs = Math.max(G.hs, 0.05);

function die(tg, killer) {

function revive(g) {

  else banner(G.stage.gen + ' returns to the field');

// ------------------------------------------------------------------ update
function update(dt) {
  G.t += dt;
  if (G.banner) { G.banner.t += dt; if (G.banner.t > 3) G.banner = null; }
  if (!G.over) {
    let inc = PLAYER_INC + upLvl('trade') + 4 * G.rice, einc = G.stage.inc * G.diff.inc;
    for (const o of G.outposts) { if (o.owner === 0) inc += 3; else if (o.owner === 1) einc += 3; }
    G.koku[0] += inc * dt; G.koku[1] += einc * dt;
    for (const k in G.cds) if (G.cds[k] > 0) G.cds[k] -= dt;
    if (G.warCd > 0) G.warCd -= dt;
    if (G.buff > 0) G.buff -= dt;
    enemySpawnAI(dt);
    updateOutposts(dt);
    for (const g of G.gen) if (g.dead && g.type !== 'emperor') { g.respT -= dt; if (g.respT <= 0) revive(g); }
    if (G.stage.hazardFire) {
      G.hazT -= dt;
      if (G.hazT <= 0) {
        G.hazT = rand(4, 7);
        if (G.zones.filter(z => z.kind === 'fire' && z.hurt === -1).length < 4) {
          const mid = G.ctrl ? G.ctrl.x : WW / 2;
          G.zones.push({ kind: 'fire', x: clamp(mid + rand(-700, 700), 500, WW - 500), ly: rand(-20, 35), r: 85, t: 0, life: 9, hurt: -1, tick: 0.5, owner: null, lw: 40 });
        }
      }
    }
    updateHints(dt);
  } else {
    G.overT += dt;
  }
  for (const u of G.units) updateUnit(u, dt);
  updateZones(dt);
  if (!G.over) for (const o of G.units) {
    if (o.dead || o.type !== 'onmyoji') continue;
    const rate = 0.02 + 0.002 * o.lvl;
    for (const a of G.units) {
      if (a.dead || a.team !== o.team || a.hp >= a.maxhp || Math.abs(a.x - o.x) > 210) continue;
      a.hp = Math.min(a.maxhp, a.hp + a.maxhp * rate * dt);
      if (Math.random() < dt * 1.5) spark(a.x + rand(-8, 8), GY + a.ly - 30, '#9affc0');
    }
  }
  for (const tt of G.toasts) tt.t += dt;
  G.toasts = G.toasts.filter(t => t.t < 4.5);
  G.chkT -= dt;
  if (G.chkT <= 0) { G.chkT = 0.5; checkAch(); checkUnlocks(); if (dirty) { writeSave(); dirty = false; } }
  // castle turrets
  for (const c of G.castle) {
    if (c.dead) { c.deadT += dt; if (Math.random() < 0.3) spark(c.x + rand(-100, 100), GY - rand(0, 40), '#ff9a3a'); continue; }
    if (c.flash > 0) c.flash -= dt;
    if (G.over) continue;
    c.fireT -= dt;
    if (c.fireT <= 0) {
      let best = null, bd = 440;
      for (const e of G.units) { if (e.dead || e.team === c.team) continue; const d = Math.abs(e.x - c.x); if (d < bd) { bd = d; best = e; } }
      if (best) {
        const dir = best.x >= c.x ? 1 : -1;
        const dm = Math.min(40, 5 + 2.2 * G.stage.pow) * (c.team ? G.diff.dmg * (G.stage.boss ? 1.5 : 1) : 1);
        G.arrows.push({ x: c.x + dir * 100, y: GY + best.ly - 48, ly: best.ly, vx: dir * 620, team: c.team, dmg: dm, life: 0.8, owner: c.owner, tier: 0, castleShot: true });
        c.fireT = 1.5;
      } else c.fireT = 0.4;
    }
  }
  // soft separation
  const live = G.units.filter(u => !u.dead);
  for (let i = 0; i < live.length; i++) {
    const a = live[i];
    if (a.state === 'attack' || a.state === 'dash' || isGen(a)) continue;
    for (let j = i + 1; j < live.length; j++) {
      const b = live[j];
      if (b.team !== a.team || b.state === 'attack' || b.state === 'dash' || isGen(b)) continue;
      const d = a.x - b.x;
      if (Math.abs(d) < 14 && Math.abs(a.ly - b.ly) < 10) {
        const p = (14 - Math.abs(d)) * dt * 6 * (d >= 0 ? 1 : -1);
        if (!a.ctrl) a.x += p;
        if (!b.ctrl) b.x -= p;
      }
    }
  }
  for (const a of G.arrows) {
    const x0 = a.x;
    a.x += a.vx * dt; a.life -= dt;
    const hw = a.hw || 14;
    const lo = Math.min(x0, a.x) - hw, hi = Math.max(x0, a.x) + hw;
    let done = false;
    for (const e of G.units) {
      if (e.dead || e.team === a.team || (a.hits && a.hits.has(e))) continue;
      if (e.x >= lo && e.x <= hi && Math.abs(e.ly - a.ly) <= 24) {
        hit(a.owner, e, a.dmg, Math.sign(a.vx) * 100, a.x - Math.sign(a.vx) * 30, false);
        if (a.owner && a.owner.ctrl && !e.dead) { gainXP(a.owner, 3); }
        if (a.pierce) a.hits.add(e);
        else { a.life = 0; done = true; break; }
      }
    }
    if (!done) for (const c of G.castle) {
      if (!c.dead && c.team !== a.team && Math.abs(a.x - c.x) < CASTLE_HALF + 8) { damageCastle(c, a.dmg * 0.6, a.owner && a.owner.x !== undefined ? { x: a.x - Math.sign(a.vx) * 10, ctrl: a.owner.ctrl } : null); a.life = 0; break; }
    }
  }
  G.arrows = G.arrows.filter(a => a.life > 0);
  G.units = G.units.filter(u => !(u.dead && u.deadT > 2.6 && !isGen(u)));
  for (const f of G.fx) f.t += dt;
  G.fx = G.fx.filter(f => f.t < f.life);
  for (const t of G.texts) { t.t += dt; t.y -= 30 * dt; }
  G.texts = G.texts.filter(t => t.t < t.life);
  for (const p of G.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 520 * dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - 30 * dt);
  for (const u of G.units) if (u.buffT > 0) u.buffT -= dt;
  const f = G.ctrl || G.gen[0];
  if (lookHeld && !G.over) { G.look = Math.max(G.look, 2); G.camT = clamp(G.camT + ((inp.right ? 1 : 0) - (inp.left ? 1 : 0)) * 1100 * dt, 0, WW - VW); }
  let tx;
  if (G.look > 0 && !G.over) {
    if (!G.dragging && !lookHeld) G.look -= dt;
    if (G.look <= 0) G.peeking = false;
    tx = clamp(G.camT, 0, WW - VW);
  } else {
    const focus = G.over ? G.focusX : f.x + f.face * 90;
    tx = clamp(focus - VW / 2, 0, WW - VW);
  }
  G.cam += (tx - G.cam) * Math.min(1, dt * (G.over ? 3 : 5));
  const zt = G.over ? 1.28 : 1;
  G.zoom += (zt - G.zoom) * Math.min(1, dt * 3);
  if (G.over && G.overT > 1.3 && G.state === 'play') endBattle();
}

function updateOutposts(dt) {
  for (const o of G.outposts) {
    let a = 0, b = 0;
    for (const u of G.units) { if (u.dead || isGen(u) || Math.abs(u.x - o.x) > 170) continue; if (u.team === 0) a++; else b++; }
    if (a > 0 && b === 0) o.prog = Math.min(1, o.prog + dt * 0.18 * Math.min(4, a));
    else if (b > 0 && a === 0) o.prog = Math.max(-1, o.prog - dt * 0.18 * Math.min(4, b));
    if (o.prog >= 0.999 && o.owner !== 0) { o.owner = 0; G.captured++; save.stats.flags++; dirty = true; floatText(o.x, GY - 130, 'FLAG CAPTURED +3/s', '#ffd86b', 1.6); sfx(700, 0.2, 'triangle', 0.06, 300); }
    else if (o.prog <= -0.999 && o.owner !== 1) { o.owner = 1; floatText(o.x, GY - 130, 'Flag lost', '#ff8a8a', 1.4); }
  }
}

function updateZones(dt) {
  for (const z of G.zones) {
    z.t += dt;
    if (z.kind === 'fire') {
      if (z.t > 1.0) {
        z.tick -= dt;
        if (z.tick <= 0) {
          z.tick = 0.5;
          const d = Math.min(40, 6 + 1.5 * G.stage.pow);
          for (const u of G.units) {
            if (u.dead || (z.hurt !== -1 && u.team !== z.hurt)) continue;
            if (Math.abs(u.x - z.x) < z.r && Math.abs(u.ly - z.ly) < z.lw) burn(u, d);
          }
        }
      }
      if (z.t >= z.life) z.done = true;
      continue;
    }
    if (z.t >= z.life && !z.done) {
      z.done = true;
      const o = z.owner;
      if (z.kind === 'slam' && (!o || o.dead)) continue;
      const side = o ? o.team : 1;
      const col = z.kind === 'frost' ? '150,220,255' : z.kind === 'rock' ? '200,170,120' : '255,220,160';
      const mult = z.kind === 'slam' ? 1.3 : z.kind === 'rock' ? 1.1 : 0.7;
      for (const e of G.units) {
        if (e.dead || e.team === side) continue;
        if (Math.abs(e.x - z.x) < z.r && Math.abs(e.ly - z.ly) < z.lw) {
          const dmg = (o ? dmgOf(o) : 20) * mult;
          if (hit(o || { x: z.x, team: side }, e, dmg, (e.x >= z.x ? 1 : -1) * 260, z.x, false) && z.kind === 'frost' && !e.dead) { e.slowT = 3; floatText(e.x, GY + e.ly - 110, 'FROZEN', '#bde', 0.8); }
        }
      }
      G.fx.push({ x: z.x, y: GY + z.ly - 6, ring: z.r, t: 0, life: 0.35, col });
      G.shake = Math.max(G.shake, z.kind === 'rock' ? 5 : 10);
      sfx(70, 0.35, 'sawtooth', 0.08, -30);
      for (let i = 0; i < 16; i++) spark(z.x + rand(-z.r, z.r), GY + z.ly - 10, '#e8c080');
    }
  }
  G.zones = G.zones.filter(z => !z.done);
}

function nearestEnemy(u, maxD) {
  let best = null, bd = maxD;
  for (const e of G.units) {
    if (e.dead || e.team === u.team) continue;
    const d = Math.abs(e.x - u.x);
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function applyTerrain(u, dt) {
  let lo = laneMin(), hi = laneMax();
  if (G.stage.river && Math.abs(u.x - WW / 2) < 175) { lo = Math.max(lo, -10); hi = Math.min(hi, 16); }
  if (u.ly < lo) u.ly = Math.min(lo, u.ly + 220 * dt);
  else if (u.ly > hi) u.ly = Math.max(hi, u.ly - 220 * dt);
}

function updateUnit(u, dt) {
  if (u.dead) { u.deadT += dt; return; }
  u.t += dt; u.cd -= dt; u.dodgeCd -= dt; u.specCd -= dt; u.iT -= dt; u.flash -= dt;
  if (u.slowT > 0) u.slowT -= dt;
  if (u.armorT > 0) u.armorT -= dt;
  if (u.life !== undefined) { u.life -= dt; if (u.life <= 0 && !G.over) { u.dead = true; u.state = 'dead'; u.deadT = 0; for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#c070ff'); return; } }
  u.comboT -= dt; if (u.comboT <= 0) u.combo = 0;
  if (u.state === 'block') u.blockT += dt;
  if (u.state === 'hurt') {
    u.stun -= dt;
    u.x += u.kb * dt; u.kb *= Math.pow(0.02, dt);
    if (u.stun <= 0) { u.state = 'idle'; u.t = 0; }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (u.state === 'attack') {
    const th = (u.special && SP_T[u.special]) || [0.5];
    while (u.hitIdx < th.length && u.t >= u.atkT * th[u.hitIdx]) {
      const i = u.hitIdx++;
      if (u.special) specialHit(u, i); else strike(u);
    }
    if (!u.special && u.t < u.atkT * 0.6) u.x += u.face * 26 * dt;
    if (u.special === 'spear' && u.t < u.atkT * 0.5) u.x += u.face * 120 * dt;
    if (u.t >= u.atkT) { u.state = 'idle'; u.t = 0; u.cd = 0.18; u.special = null; }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (u.state === 'dash') {
    u.x += u.face * (u.dashSpd || 520) * dt;
    if (u.dashMult) {
      for (const e of enemiesOf(u)) {
        if (u.dashSet.has(e) || Math.abs(e.x - u.x) > 46 || Math.abs(e.ly - u.ly) > LANE_HIT + 6) continue;
        u.dashSet.add(e);
        if (hit(u, e, dmgOf(u) * u.dashMult, u.face * 200, u.x - u.face * 20, true) && u.ctrl) gainXP(u, 6);
      }
    }
    if (u.t >= (u.dashDur || 0.26)) {
      if (u.afterSlash) { G.fx.push({ x: u.x + u.face * 30, y: GY + u.ly - 44, face: u.face, t: 0, life: 0.16, big: true, tier: spriteTier(u), sc: 1.2 }); hitCastleWith(u, dmgOf(u) * 2.2, 40); u.afterSlash = false; }
      u.state = 'idle'; u.t = 0; u.dashMult = 0; u.dashSpd = 0; u.dashDur = 0.26;
    }
    clampX(u); applyTerrain(u, dt); return;
  }
  if (G.over) { if (u.state !== 'idle') { u.state = 'idle'; } return; }
  if (u.ctrl) ctrlUpdate(u, dt); else aiUpdate(u, dt);
  clampX(u); applyTerrain(u, dt);
}
function clampX(u) {
  u.x = clamp(u.x, 80, WW - 80);
  if (u.team === 0) u.x = Math.min(u.x, G.castle[1].x - CASTLE_HALF);
  else u.x = Math.max(u.x, G.castle[0].x + CASTLE_HALF);
  u.ly = clamp(u.ly, laneMin(), laneMax());
}

function trySpecial(u, mx) {
  const sp = SPECIALS[u.type];
  if (!sp) return;
  if (mx) u.face = mx;
  else { const e = nearestEnemy(u, 400); if (e) u.face = e.x >= u.x ? 1 : -1; }
  u.specCd = sp.cd; save.stats.specials++; dirty = true;
  floatText(u.x, GY + u.ly - 130, sp.name, '#ffd86b', 1.0);
  switch (u.type) {
    case 'samurai': startDash(u, 1000, 0.17, 2.2, true); u.afterSlash = true; sfx(900, 0.15, 'sawtooth', 0.06, -600); break;
    case 'ashigaru': startAttack(u, 'spear', 0.5); break;
    case 'archer': startAttack(u, 'fan', 0.6); break;
    case 'sohei': startAttack(u, 'whirl', 0.6); break;
    case 'ronin': startAttack(u, 'dance', 0.9); u.iT = 0.95; break;
    case 'heavy': startAttack(u, 'quake', 0.8); break;
    case 'general': startAttack(u, 'decree', 0.6); break;
    case 'ninja': {
      const e = nearestEnemy(u, 450);
      for (let k = 0; k < 10; k++) spark(u.x, GY + u.ly - rand(10, 60), '#888');
      if (e) {
        u.x = e.x - e.face * 46; u.ly = e.ly; u.face = e.face;
        for (let k = 0; k < 10; k++) spark(u.x, GY + u.ly - rand(10, 60), '#888');
        startAttack(u, 'smoke', 0.42); u.iT = 0.5; sfx(800, 0.15, 'sine', 0.05, -500);
      } else startDash(u, 700, 0.25, 1.5, true);
      break;
    }
    case 'gunner': startAttack(u, 'pierce', 0.7); break;
    case 'onmyoji': startAttack(u, 'ward', 0.6); break;
  }
}

function ctrlUpdate(u, dt) {
  const b = UNITS[u.type];
  const canAct = u.state === 'idle' || u.state === 'walk' || u.state === 'block';
  const mx = lookHeld ? 0 : (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const my = lookHeld ? 0 : (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
  if ((mx || my || inp.atk || inp.block) && G.look > 0 && !G.dragging && !lookHeld) { G.look = 0; G.peeking = false; }
  if (u.state === 'block' && !inp.block) { u.state = 'idle'; u.t = 0; }
  if (inp.specialP) {
    inp.specialP = false;
    if (canAct && u.specCd <= 0 && u.state !== 'block') { trySpecial(u, mx); return; }
  }
  if (inp.dodgeP) {
    inp.dodgeP = false;
    if (canAct && u.dodgeCd <= 0) {
      u.state = 'dash'; u.t = 0; u.iT = 0.3; u.dodgeCd = 0.8; u.dashSpd = 520; u.dashDur = 0.26; u.dashMult = 0;
      if (mx) u.face = mx;
      sfx(200, 0.12, 'triangle', 0.04, 200);
      return;
    }
  }
  if (inp.block && (u.state === 'idle' || u.state === 'walk')) { u.state = 'block'; u.blockT = 0; u.t = 0; }
  else if (inp.atk && u.cd <= 0 && (u.state === 'idle' || u.state === 'walk')) {
    if (mx) u.face = mx;
    else {
      const e = nearestEnemy(u, b.ranged ? 360 : rangeOf(u) + 90);
      if (e) u.face = e.x >= u.x ? 1 : -1;
    }
    startAttack(u); return;
  }
  if (canAct) {
    const sp = spdOf(u) * (u.state === 'block' ? 0.35 : 1);
    if (mx) { u.face = mx; u.x += mx * sp * dt; }
    if (my) u.ly += my * sp * 0.7 * dt;
    if (u.state !== 'block') {
      const ns = (mx || my) ? 'walk' : 'idle';
      if (ns !== u.state) { u.state = ns; u.t = 0; }
    }
  }
}

function summonGuards(u, n) {
  for (let i = 0; i < n; i++) {
    const g = mk(i % 2 ? 'samurai' : 'heavy', 1, u.x - 70 - i * 28, G.stage.lvl);
    g.summoned = true;
    G.units.push(g);
    for (let k = 0; k < 8; k++) spark(g.x, GY + g.ly - 30, '#c070ff');
  }
  banner(G.stage.gen + ' summons his guard!');
  sfx(140, 0.5, 'sawtooth', 0.06, 100);
}
function startSlam(u) {
  u.state = 'attack'; u.t = 0; u.hitIdx = 99; u.special = null; u.atkT = 0.9;
  G.zones.push({ kind: 'slam', x: u.x + u.face * 80, ly: u.ly, r: 210, t: 0, life: 0.9, owner: u, lw: 70, done: false });
  sfx(110, 0.5, 'sawtooth', 0.05, -40);
}

function runAbility(u, tg) {
  const nm = G.stage.gen;
  const ab = G.stage.ability;
  switch (ab) {
    case 'charge':
      u.face = tg.x >= u.x ? 1 : -1; startDash(u, 640, 0.6, 1.4, false); banner(nm + ': CHARGE!'); sfx(160, 0.5, 'sawtooth', 0.06, 100); break;
    case 'archers':
      summonUnits(1, 'archer', 2, u.x - 60, 0); banner(nm + ' calls his archers!'); break;
    case 'rockfall': {
      const targets = G.units.filter(e => e.team === 0 && !e.dead).sort((a, b) => Math.abs(a.x - u.x) - Math.abs(b.x - u.x)).slice(0, 3);
      for (const e of targets) G.zones.push({ kind: 'rock', x: e.x + rand(-30, 30), ly: e.ly, r: 78, t: 0, life: 1.0, owner: u, lw: 45, done: false });
      banner(nm + ' triggers a rockslide!'); sfx(90, 0.5, 'sawtooth', 0.05, -30); break;
    }
    case 'blink': {
      for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#9ad0ff');
      u.x = tg.x + (u.x < tg.x ? 70 : -70); u.ly = tg.ly; u.face = tg.x >= u.x ? 1 : -1;
      for (let i = 0; i < 10; i++) spark(u.x, GY + u.ly - 40, '#9ad0ff');
      banner(nm + ' vanishes in the mist!'); startAttack(u); sfx(900, 0.2, 'sine', 0.06, -500); break;
    }
    case 'fire':
      for (let i = 0; i < 4; i++) G.zones.push({ kind: 'fire', x: u.x + u.face * (90 + i * 110), ly: u.ly + rand(-15, 15), r: 70, t: 0, life: 6, hurt: 0, tick: 0.5, owner: u, lw: 40 });
      banner(nm + ' sets the ground ablaze!'); break;
    case 'wall':
      summonUnits(1, 'heavy', 2, u.x - 60, 0); u.armorT = 5; floatText(u.x, GY + u.ly - 140, 'IRON WALL', '#cde', 1.4); banner(nm + ': Iron Wall!'); break;
    case 'frost':
      G.zones.push({ kind: 'frost', x: u.x, ly: u.ly, r: 210, t: 0, life: 0.9, owner: u, lw: 80, done: false });
      banner(nm + ' gathers a killing frost!'); break;
    case 'clones':
      summonUnits(1, 'ronin', 3, u.x - 50, 12); banner(nm + ' summons shadow clones!'); break;
    case 'warcry':
      for (const a of alliesOf(1)) { a.buffT = 6; a.hp = Math.min(a.maxhp, a.hp + a.maxhp * 0.15); for (let k = 0; k < 4; k++) spark(a.x, GY + a.ly - 50, '#ff8a70'); }
      banner(nm + ' roars: the enemy army surges!'); G.shake = 5; sfx(150, 0.4, 'sawtooth', 0.06, 80); break;
  }
}

function aiUpdate(u, dt) {
  const b = UNITS[u.type];
  const home = isGen(u);
  const sp = spdOf(u);
  const ec = G.castle[1 - u.team];
  const goto = (tx, speed) => {
    const d = tx - u.x;
    if (Math.abs(d) < 6) { setIdle(u); return; }
    u.face = d > 0 ? 1 : -1; u.x += u.face * speed * dt;
    if (u.state !== 'walk') { u.state = 'walk'; u.t = 0; }
  };
  const engageT = tg => {
    const dist = Math.abs(tg.x - u.x);
    const reach = b.ranged ? b.range * 0.92 : rangeOf(u);
    const dy = tg.ly - u.ly;
    if (Math.abs(dy) > 14) u.ly += Math.sign(dy) * Math.min(Math.abs(dy), sp * 0.6 * dt);
    if (dist <= reach) {
      u.face = tg.x >= u.x ? 1 : -1;
      if (Math.abs(dy) <= 20) { if (u.cd <= 0) startAttack(u); else setIdle(u); }
      else if (u.state !== 'walk') { u.state = 'walk'; u.t = 0; }
    } else goto(tg.x, sp);
  };
  const tg0 = nearestEnemy(u, 1e9);
  const dist0 = tg0 ? Math.abs(tg0.x - u.x) : 1e9;
  if (u.type === 'emperor' && !G.over) {
    u.summonT -= dt; u.slamT -= dt;
    const ph2 = u.hp < u.maxhp * 0.5;
    if (ph2 && !u.enraged) { u.enraged = true; banner(G.stage.gen.toUpperCase() + ' IS ENRAGED!'); G.shake = 10; sfx(90, 0.6, 'sawtooth', 0.08, 40); }
    if (u.summonT <= 0) { summonGuards(u, ph2 ? 4 : 3); u.summonT = ph2 ? 9 : 14; }
    if (u.slamT <= 0 && tg0 && dist0 < 280 && Math.abs(tg0.ly - u.ly) < 60) { startSlam(u); u.slamT = ph2 ? 6 : 9; return; }
    if (G.stage.ability) {
      u.abT -= dt;
      if (u.abT <= 0 && tg0 && dist0 < 520) { runAbility(u, tg0); u.abT = rand(13, 18); if (u.state === 'attack' || u.state === 'dash') return; }
    }

// enemy spawn AI
function enemyWeights() {
  const i = G.stage.pow;
  const w = {
    ashigaru: Math.max(1, 4 - 0.3 * i), samurai: 0.3 + 0.7 * Math.min(i, 4), archer: i === 0 ? 0.6 : Math.min(4.5, 2 + 0.1 * i),
    sohei: Math.min(4.5, 1 + 0.15 * i), ronin: Math.min(5, 1 + 0.2 * i), heavy: Math.min(5, 0.4 + 0.25 * i) + (G.stage.boss ? 1.2 : 0),
    gunner: Math.min(2.5, 0.3 + 0.1 * i), ninja: Math.min(2.5, 0.3 + 0.1 * i),
  };
  for (const k in ENEMY_UNLOCK) if (i < ENEMY_UNLOCK[k]) w[k] = 0;
  const mine = alliesOf(0);
  const arch = mine.filter(u => u.type === 'archer').length;
  const heavy = mine.filter(u => u.type === 'heavy').length;
  if (arch > 3 && w.ronin > 0) w.ronin += 2;
  if (heavy > 1) w.archer += 1.5;
  if (G.diffKey === 'hard' && w.heavy > 0) w.heavy += 0.8;
  return w;
}
function enemySpawnAI(dt) {
  G.spawnT -= dt;
  if (G.spawnT > 0) return;
  if (!G.want) {
    const w = enemyWeights();
    let tot = 0; for (const k in w) tot += w[k];
    let r = Math.random() * tot, pick = 'ashigaru';
    for (const k in w) { r -= w[k]; if (r <= 0) { pick = k; break; } }
    G.want = pick; G.wantT = 0;
  }
  G.wantT += dt;
  const b = UNITS[G.want];
  if (G.koku[1] >= b.cost && pop(1) < MAX_POP) {
    spawn(1, G.want);
    G.want = null;
    G.spawnT = rand(0.5, 1.6) * (G.diffKey === 'easy' ? 1.4 : G.diffKey === 'hard' ? 0.7 : 1);
  } else if (G.wantT > 5) {
    G.want = 'ashigaru';
  }
}

    let x, y;
    if (at === 'snow') { x = ((p.x - cam * 0.6 + Math.sin(G.t + p.ph) * 14) % VW + VW) % VW; y = (p.y + G.t * p.v * 2.2) % VH; }
    else if (at === 'ember') { x = ((p.x - cam * 0.6 + Math.sin(G.t * 2 + p.ph) * 12) % VW + VW) % VW; y = ((p.y - G.t * p.v * 1.5) % VH + VH) % VH; }
    else if (at === 'firefly') { x = ((p.x - cam * 0.6 + Math.sin(G.t * .7 + p.ph) * 40) % VW + VW) % VW; y = 260 + (p.y % 190) + Math.sin(G.t + p.ph) * 12; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(G.t * 3 + p.ph); }
    else if (at === 'dust') { x = ((p.x - cam * 0.8 + G.t * p.v) % VW + VW) % VW; y = 250 + (p.y % 220); }
    else { x = ((p.x - cam * 0.6 + Math.sin(G.t + p.ph) * 20) % VW + VW) % VW; y = (p.y + G.t * p.v) % VH; }
    ctx.fillRect(x, y, p.s + 1, p.s);
    ctx.globalAlpha = 1;
  }
  const gg = ctx.createLinearGradient(0, GY - 36, 0, VH);
  gg.addColorStop(0, theme.g[0]); gg.addColorStop(0.4, theme.g[1]); gg.addColorStop(1, theme.g[2]);
  ctx.fillStyle = gg; ctx.fillRect(0, GY - 36, VW, VH - GY + 36);
  ctx.fillStyle = theme.dirt; ctx.fillRect(0, GY - 16, VW, 56);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(0, GY - 36, VW, 3);
  for (const t of tufts) {
    const x = t.x - cam;
    if (x < -10 || x > VW + 10) continue;
    ctx.fillStyle = t.c; ctx.fillRect(x, t.y, 2, t.h); ctx.fillRect(x + 3, t.y + 1, 2, t.h - 1);
  }
  // river + bridge
  if (G.stage.river) {
    const mid = WW / 2 - cam, half = 175;
    if (mid > -half - 20 && mid < VW + half + 20) {
      const wg = ctx.createLinearGradient(0, GY - 36, 0, VH);
      wg.addColorStop(0, '#3a6a9a'); wg.addColorStop(1, '#1a3a5a');
      ctx.fillStyle = wg; ctx.fillRect(mid - half, GY - 36, half * 2, VH - GY + 36);
      ctx.strokeStyle = 'rgba(200,230,255,.35)'; ctx.lineWidth = 2;
      for (let i = 0; i < 18; i++) {
        const wx = mid - half + 10 + ((i * 53 + G.t * 22) % (half * 2 - 20)), wy = GY - 20 + ((i * 29) % 100);
        ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + 14, wy); ctx.stroke();
      }
      ctx.fillStyle = '#7a5a38'; ctx.fillRect(mid - half - 6, GY - 20, half * 2 + 12, 44);
      ctx.fillStyle = '#5a3e26'; for (let i = mid - half - 6; i < mid + half + 6; i += 14) ctx.fillRect(i, GY - 20, 2, 44);
      ctx.fillStyle = '#3a2816'; ctx.fillRect(mid - half - 6, GY - 22, half * 2 + 12, 3); ctx.fillRect(mid - half - 6, GY + 22, half * 2 + 12, 3);
    }
  }
  for (const o of G.outposts) drawOutpost(o, cam);
  drawCastle(G.castle[0], cam); drawCastle(G.castle[1], cam);
  for (const z of G.zones) drawZone(z, cam);
  if (G.order.mode === 'hold') {
    const fx = G.order.x - cam;
    ctx.fillStyle = '#4f7aa8'; ctx.fillRect(fx - 1, GY - 60, 3, 66);
    ctx.fillStyle = '#8fc0ff'; ctx.beginPath(); ctx.moveTo(fx + 2, GY - 60); ctx.lineTo(fx + 26, GY - 52); ctx.lineTo(fx + 2, GY - 42); ctx.closePath(); ctx.fill();
  }
  const list = G.units.slice().sort((a, b) => (a.dead === b.dead ? (a.ly - b.ly) : (a.dead ? -1 : 1)));
  for (const u of list) drawUnit(u, cam);
  ctx.lineWidth = 2;
  for (const a of G.arrows) {
    const x = a.x - cam, y = a.y, sg = Math.sign(a.vx);
    if (a.kind === 'bullet') {
      ctx.strokeStyle = 'rgba(255,230,160,.8)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(x - sg * 34, y); ctx.lineTo(x, y); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillRect(x - 2, y - 2, 5, 5); ctx.lineWidth = 2; continue;
    }
    if (a.kind === 'talisman') {
      ctx.save(); ctx.translate(x, y); ctx.rotate(G.t * 14);
      ctx.fillStyle = '#f4eefc'; ctx.fillRect(-4, -6, 8, 12); ctx.fillStyle = '#8a4ac0'; ctx.fillRect(-1, -4, 2, 8); ctx.restore();
      ctx.strokeStyle = 'rgba(180,120,255,.5)'; ctx.beginPath(); ctx.moveTo(x - sg * 16, y); ctx.lineTo(x - sg * 4, y); ctx.stroke(); continue;
    }
    ctx.strokeStyle = a.tier >= 1 ? TIER_COL[a.tier] : '#e8d8b0';
    ctx.beginPath(); ctx.moveTo(x - Math.sign(a.vx) * 18, y); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(x - (a.vx > 0 ? 0 : 3), y - 1, 3, 3);
  }
  for (const f of G.fx) {
    const k = f.t / f.life, x = f.x - cam;
    if (f.ring) {
      ctx.strokeStyle = `rgba(${f.col || '255,220,160'},${1 - k})`; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.ellipse(x, f.y, f.ring * (0.4 + 0.6 * k), f.ring * 0.28 * (0.4 + 0.6 * k), 0, 0, 7); ctx.stroke();
      continue;
    }
    if (f.puff) {
      ctx.globalAlpha = 1 - k; ctx.fillStyle = k < 0.35 ? '#ffe08a' : '#b8b0a8';
      ctx.beginPath(); ctx.arc(x, f.y, 8 + k * 22, 0, 7); ctx.fill(); ctx.globalAlpha = 1; continue;
    }
    ctx.save(); ctx.translate(x, f.y); ctx.scale(f.face, 1);
    const col = f.tier >= 1 ? TIER_COL[f.tier] : '#ffffff';
    ctx.globalAlpha = 1 - k; ctx.strokeStyle = col;
    ctx.lineWidth = (f.big ? 5 : 3) + (f.tier >= 2 ? 2 : 0);
    const sc = f.sc || 1;
    ctx.beginPath(); ctx.arc(-24 * sc, 0, (f.big ? 58 : 46) * sc, -1.1 + k * 0.6, 1.1 + k * 0.4); ctx.stroke();
    ctx.restore();
  }
  for (const p of G.parts) {
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.col; ctx.fillRect(p.x - cam, p.y, 3, 3);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of G.texts) {
    ctx.globalAlpha = Math.min(1, (t.life - t.t) / 0.3);
    ctx.font = 'bold 16px system-ui'; ctx.lineWidth = 3; ctx.strokeStyle = '#000'; ctx.fillStyle = t.col;
    ctx.strokeText(t.text, t.x - cam, t.y); ctx.fillText(t.text, t.x - cam, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  // darkness (forest)
  if (G.stage.dark && G.state !== 'menu') {
    const f = G.ctrl || G.gen[0];
    const dx = f.x - cam, dy = GY + f.ly - 40;
    const dg = ctx.createRadialGradient(dx, dy, 120, dx, dy, 480);
    dg.addColorStop(0, 'rgba(0,0,12,0)'); dg.addColorStop(1, 'rgba(0,0,12,.7)');
    ctx.fillStyle = dg; ctx.fillRect(0, 0, VW, VH);
  }
}

function bar(x, y, w, h, p, col) {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = col; ctx.fillRect(x, y, w * Math.max(0, Math.min(1, p)), h);
  ctx.strokeStyle = 'rgba(0,0,0,.8)'; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function txt(s, x, y, size, col, align = 'left') {
  ctx.font = `bold ${size}px system-ui`; ctx.textAlign = align; ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.8)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

// ------------------------------------------------------------------ UI: cards
const cardEls = [];
function buildCards() {
  cardsEl.innerHTML = '';
  cardEls.length = 0;
  save.loadout.forEach((t, i) => {
    const b = UNITS[t];
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<span class="key">${i + 1}</span><canvas width="56" height="32"></canvas><span class="nm">${b.name}</span><span class="cost">${b.cost}</span><div class="cd"></div>`;
    const ic = d.querySelector('canvas').getContext('2d');
    ic.imageSmoothingEnabled = false;
    if (imgs[t + '_a0']) ic.drawImage(imgs[t + '_a0'], 0, 0, FW, FH, 0, 0, FW, FH);
    d.title = b.name + ': ' + b.desc;
    d.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); if (G && G.state === 'play') spawn(0, t); });
    cardsEl.appendChild(d);
    cardEls.push({ el: d, type: t });
  });
  const r = document.createElement('div'); r.className = 'card special';
  r.innerHTML = '<span class="key">U</span><div style="font-size:22px">🌾</div><span class="nm">Rice Paddies</span><span class="cost"></span><div class="cd"></div>';
  r.title = 'Upgrade income (+4 koku/s)';
  r.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') buyRice(); });
  cardsEl.appendChild(r); cardEls.push({ el: r, type: 'rice' });
  const w = document.createElement('div'); w.className = 'card special';
  w.innerHTML = '<span class="key">R</span><div style="font-size:22px">📯</div><span class="nm">War Cry</span><span class="cost">' + WAR_COST + '</span><div class="cd"></div>';
  w.title = 'Army +30% damage, +20% speed for 6s';
  w.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') warCry(); });
  cardsEl.appendChild(w); cardEls.push({ el: w, type: 'war' });
  [['attack', '⚔', '7', 'Advance: army marches on the enemy castle'], ['hold', '⚑', '8', 'Hold the line where you stand'], ['follow', '👣', '9', 'Follow me: army gathers around the unit you control']].forEach(([m, ico, k, tip]) => {
    const o = document.createElement('div'); o.className = 'card order'; o.dataset.mode = m;
    o.innerHTML = `<span class="key">${k}</span><div class="ico">${ico}</div><span class="nm">${m === 'attack' ? 'Advance' : m === 'hold' ? 'Hold' : 'Follow'}</span>`;
    o.title = tip;
    o.addEventListener('pointerdown', e => { e.preventDefault(); if (G && G.state === 'play') setOrder(m); });
    cardsEl.appendChild(o);
  });
  refreshOrderCards();
}
function refreshOrderCards() {
  cardsEl.querySelectorAll('.order').forEach(o => o.classList.toggle('act', G && o.dataset.mode === G.order.mode));
}
function updateCards() {
  if (!G) return;
  for (const c of cardEls) {
    let ok = true, cdp = 0, lock = false;
    if (c.type === 'rice') {
      const maxed = G.rice >= RICE_COSTS.length;
      const cost = maxed ? 0 : RICE_COSTS[G.rice];
      c.el.querySelector('.cost').textContent = maxed ? 'MAX' : cost;
      ok = !maxed && G.koku[0] >= cost;
    } else if (c.type === 'war') {
      ok = G.koku[0] >= WAR_COST && G.warCd <= 0; cdp = Math.max(0, G.warCd / WAR_CD);
    } else {
      const b = UNITS[c.type];
      lock = !unlocked(c.type);
      ok = G.koku[0] >= b.cost && pop(0) < MAX_POP;
      cdp = Math.max(0, (G.cds[c.type] || 0) / (b.cd * (1 - 0.08 * upLvl('drill'))));
      if (cdp > 0) ok = false;
      c.el.querySelector('.cost').textContent = b.cost;
    }
    c.el.classList.toggle('locked', lock);
    c.el.classList.toggle('off', !ok && !lock);
    c.el.querySelector('.cd').style.height = (cdp * 100) + '%';
  }
}

// ------------------------------------------------------------------ UI: overlays
function showOverlay(html, mode, clear) {
  overlayMode = mode || '';
  overlay.className = clear ? 'clear' : '';
  overlay.style.display = 'flex'; overlay.innerHTML = html;
}
function hideOverlay() { overlayMode = ''; overlay.style.display = 'none'; overlay.innerHTML = ''; }
function diffButtons() {
  return '<div class="btns" style="margin-top:4px">' + Object.keys(DIFFS).map(k =>
    `<div class="btn small ${k === save.diff ? 'sel' : 'dim'}" data-d="${k}">${DIFFS[k].label}</div>`).join('') + '</div>';
}
function bindDiff() {
  overlay.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => {
    save.diff = b.dataset.d; writeSave();
    overlay.querySelectorAll('[data-d]').forEach(x => { x.classList.toggle('sel', x.dataset.d === save.diff); x.classList.toggle('dim', x.dataset.d !== save.diff); });
  }));
}

      ${hasProg ? '<div class="btn alt small" id="reset">New campaign</div>' : ''}
    </div>
    <p class="keys" style="margin-top:10px">Difficulty</p>${diffButtons()}
    <p class="keys" style="margin-top:8px">${hasProg ? 'World conquest: ' + regionsConquered() + '/' + REGIONS.length + ' regions · ' + save.cleared + '/' + STAGES.length + ' battles won' : 'Click, tap, or press Enter'}</p>`, 'title', true);
  bindDiff();
  document.getElementById('start').onclick = startFromTitle;

function startFromTitle() {
  initAudio();
  if (!save.seenHelp) showHowTo(0, () => showWorld());
  else showWorld();
}

function showHowTo(i, after) {
  const p = HELP_PAGES[i];
  const last = i === HELP_PAGES.length - 1;
  showOverlay(`<h2>How to play</h2>
    <div class="help"><h3>${p.t}</h3>${p.body}</div>
    <div class="dots">${HELP_PAGES.map((_, k) => k === i ? '●' : '○').join(' ')}</div>
    <div class="btns">
      ${i > 0 ? '<div class="btn alt" id="prev">Back</div>' : ''}
      <div class="btn" id="next">${last ? "Let's go!" : 'Next'}</div>
      ${last ? '' : '<div class="btn alt small" id="skip" style="align-self:center">Skip</div>'}
    </div>`, 'howto');
  const finish = () => { save.seenHelp = true; writeSave(); after(); };
  document.getElementById('next').onclick = () => last ? finish() : showHowTo(i + 1, after);
  const pv = document.getElementById('prev'); if (pv) pv.onclick = () => showHowTo(i - 1, after);
  const sk = document.getElementById('skip'); if (sk) sk.onclick = finish;
}

function worldSvg(sel, small, fresh) {
  const cur = currentRegion();
  let o = `<svg viewBox="0 0 900 420" class="${small ? '' : 'wsvg'}"><defs><linearGradient id="oc${small ? 's' : 'b'}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3550"/><stop offset="1" stop-color="#2d5878"/></linearGradient></defs>
    <rect width="900" height="420" fill="url(#oc${small ? 's' : 'b'})"/>`;
  for (let i = 1; i < 6; i++) o += `<line x1="0" y1="${i * 70}" x2="900" y2="${i * 70}" stroke="rgba(255,255,255,.05)"/>`;
  for (const d of LAND) o += `<path d="${d}" fill="#bfa974" stroke="#8a7648" stroke-width="2" stroke-linejoin="round"/>`;
  let route = '';
  WORLD_POS.forEach((p, i) => { route += (i ? ' ' : '') + p.join(','); });
  o += `<polyline points="${route}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="3 6"/>`;
  const doneRoute = WORLD_POS.slice(0, Math.min(regionsConquered() + 1, WORLD_POS.length)).map(p => p.join(',')).join(' ');
  o += `<polyline points="${doneRoute}" fill="none" stroke="#e8463a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  REGIONS.forEach((R, i) => {
    const [x, y] = WORLD_POS[i], r = WORLD_R[i];
    const conq = save.cleared >= R.end, reached = save.cleared >= R.start;
    const prog = Math.max(0, Math.min(1, (save.cleared - R.start) / R.n));
    const fill = conq ? 'rgba(216,53,42,.72)' : reached ? `rgba(216,53,42,${0.15 + prog * 0.45})` : 'rgba(90,90,100,.5)';
    const stroke = i === sel ? '#ffffff' : conq ? '#ff8a7a' : i === cur ? '#ffd86b' : '#6a6a78';
    const isFresh = fresh !== undefined && fresh === i;
    o += `<g class="nd" data-region="${i}" ${reached ? '' : 'style="cursor:not-allowed"'}>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${i === sel ? 4 : 2.5}" ${i === cur && !conq ? 'stroke-dasharray="5 4"' : ''} class="${(i === cur && !conq) || isFresh ? 'pulse' : ''}"/>`;
    if (conq) o += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${r > 16 ? 16 : 12}" fill="#fff" pointer-events="none">⚑</text>`;
    else if (!reached) o += `<text x="${x}" y="${y + 5}" text-anchor="middle" font-size="${r > 16 ? 14 : 10}" fill="#ccc" pointer-events="none">🔒</text>`;
    else o += `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="${r > 16 ? 12 : 9}" font-weight="800" fill="#fff" pointer-events="none">${Math.max(0, Math.min(R.n, save.cleared - R.start))}/${R.n}</text>`;
    if (!small) o += `<text x="${x + WORLD_LBL[i][0]}" y="${y + WORLD_LBL[i][1] + 4}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.7)" stroke-width="3" paint-order="stroke" pointer-events="none">${R.name}</text>`;
    o += '</g>';
  });
  return o + '</svg>';
}

}

const NODES10 = [[60, 320], [150, 245], [240, 305], [330, 220], [420, 290], [510, 195], [600, 270], [690, 180], [775, 250], [835, 110]];
const NODES6 = [[70, 310], [210, 235], [350, 300], [500, 210], [650, 275], [800, 120]];
function showMap(sel) {
  if (G) G.state = 'menu';
  sel = Math.max(0, Math.min(STAGES.length - 1, sel));
  const st = STAGES[sel], R = REGIONS[st.region];
  const N = R.n === 10 ? NODES10 : NODES6;
  const rnd = mulberry(5 + st.region * 13);
  let deco = '';
  for (let i = 0; i < 34; i++) {
    const x = 20 + rnd() * 860, y = 25 + rnd() * 330, s = 8 + rnd() * 14;
    if (N.some(n => Math.hypot(n[0] - x, n[1] - y) < 40)) continue;
    deco += `<polygon points="${x},${y - s} ${x + s},${y + s * 0.6} ${x - s},${y + s * 0.6}" fill="#b89c68" stroke="#7a6038" stroke-width="1.2" opacity=".75"/>`;
  }
  deco += '<ellipse cx="560" cy="338" rx="70" ry="22" fill="#8fc0d4" stroke="#5a8aa0"/><ellipse cx="110" cy="120" rx="60" ry="26" fill="#8fc0d4" stroke="#5a8aa0"/>';
  const doneN = Math.max(0, Math.min(R.n - 1, save.cleared - R.start));
  const pts = N.map(n => n.join(',')).join(' ');
  const clearedPts = N.slice(0, doneN + 1).map(n => n.join(',')).join(' ');
  let nodes = '';
  N.forEach((n, li) => {
    const g = R.start + li;
    const cleared = g < save.cleared, next = g === save.cleared, locked = g > save.cleared;
    const isBoss = li === R.n - 1;
    const r = isBoss ? 27 : 18;
    const fill = cleared ? '#d8a82a' : next ? '#c9362b' : '#6a6a6a';
    const label = isBoss ? '♛' : (cleared ? '✓' : (locked ? '🔒' : String(li + 1)));
    nodes += `<g class="nd" data-node="${g}" ${locked ? 'style="cursor:not-allowed"' : ''}>
      <circle cx="${n[0]}" cy="${n[1]}" r="${r}" fill="${fill}" stroke="${g === sel ? '#fff' : '#3a2a18'}" stroke-width="${g === sel ? 4 : 2.5}" class="${next ? 'pulse' : ''}"/>
      <text x="${n[0]}" y="${n[1] + 6}" text-anchor="middle" font-size="${isBoss ? 22 : 16}" font-weight="800" fill="#fff" pointer-events="none">${label}</text>
      <text x="${n[0]}" y="${n[1] + r + 14}" text-anchor="middle" font-size="11" font-weight="700" fill="#3a2a18" pointer-events="none">${R.stages[li].name}</text></g>`;
  });
  const vet = Object.keys(save.legacy).filter(k => save.legacy[k] >= 4 && UNITS[k]).map(k => `${UNITS[k].name} Lv${save.legacy[k]}`);
  const vetLine = vet.length ? `<div class="vet">Veteran lineage: ${vet.join(', ')}. New recruits of these classes start stronger.</div>` : '';
  const unl = ROSTER.filter(k => (k in KILLS_REQ) && !owned(k)).map(k => `${UNITS[k].name} (${KILLS_REQ[k]} kills)`);
  const unlLine = (unl.length ? `<div class="vet">Locked units: ${unl.join(', ')} · you have ${kills()} kills</div>` : '') + (ROSTER.some(k => (k in BUY_COST) && !owned(k)) ? '<div class="vet">New soldiers for sale in the Barracks (treasure)</div>' : '');
  const noteLine = notice ? `<div class="vet" style="color:#7af7e6">${notice}</div>` : ''; notice = '';
  const finalBoss = st.region === REGIONS.length - 1 && st.boss;
  showOverlay(`
    <div class="xbtn" id="xback">← World map</div>
    <div class="hdr"><h2>${R.name}: ${R.title} <span style="font-size:.6em;color:#cbb36a">· Honor ${save.honor} · 💎 ${save.treasure}</span></h2>
      <div class="mini" id="mini" title="Open the world map">${worldSvg(st.region, true)}</div></div>
    <div class="mapwrap">
      <svg viewBox="0 0 900 380" style="background:${R.paper}">${deco}
        <polyline points="${pts}" fill="none" stroke="#7a5a3a" stroke-width="5" stroke-dasharray="3 9" stroke-linecap="round"/>
        <polyline points="${clearedPts}" fill="none" stroke="#d8a82a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        ${nodes}</svg>
      <div class="brief"><b>Battle ${st.local + 1}/${R.n}: ${st.name}</b> · Enemy: ${st.gen}${st.boss ? (finalBoss ? ' (FINAL BOSS)' : ' (REGION BOSS)') : ''} · Their weapons: ${TIER_NAMES[tierOf(st.boss ? st.bossLvl + 8 : st.lvl)]}<br><i>${st.blurb}</i></div>
      ${vetLine}${unlLine}${noteLine}
      <div class="btns act"><div class="btn" id="fight">${sel < save.cleared ? 'Replay battle' : 'Fight!'}</div>
        <div class="btn alt small" id="world" style="align-self:center">World map</div>
        <div class="btn alt small" id="barr" style="align-self:center">Barracks</div>
        <div class="btn alt small" id="forge" style="align-self:center">Forge &amp; Dojo</div>
        <div class="btn alt small" id="achm" style="align-self:center">Achievements</div>
        <div class="btn alt small" id="help" style="align-self:center">How to play</div>
        <div class="btn alt small" id="toTitle" style="align-self:center">Menu</div></div>
      ${diffButtons()}
    </div>`, 'map');
  bindDiff();
  overlay.querySelectorAll('[data-node]').forEach(g => g.addEventListener('click', () => {
    const i = +g.dataset.node;
    if (i > save.cleared) return;
    showMap(i);
  }));
  document.getElementById('mini').onclick = () => showWorld(st.region);
  document.getElementById('xback').onclick = () => showWorld(st.region);
  document.getElementById('world').onclick = () => showWorld(st.region);
  document.getElementById('fight').onclick = () => { initAudio(); startStage(sel); };
  document.getElementById('toTitle').onclick = showTitle;
  document.getElementById('forge').onclick = () => showShop(sel);
  document.getElementById('barr').onclick = () => showBarracks(sel);
  document.getElementById('achm').onclick = () => showAch(() => showMap(sel));
  document.getElementById('help').onclick = () => showHowTo(0, () => showMap(sel));
}

function showShop(sel) {
  const rows = UPGRADES.map(u => {
    const lv = upLvl(u.id), maxed = lv >= u.max, cost = u.base * (lv + 1);
    return `<div class="row"><div><b>${u.name}</b> Lv ${lv}/${u.max}<small>${u.desc}</small></div>
      <div class="btn small ${maxed || save.honor < cost ? 'off' : ''}" data-up="${u.id}">${maxed ? 'MAX' : 'Buy ' + cost}</div></div>`;
  }).join('');
  showOverlay(`<h2>Forge &amp; Dojo <span style="font-size:.6em;color:#cbb36a">· Honor ${save.honor}</span></h2>
    <div class="shop">${rows}</div>
    <p class="keys">Earn Honor by winning battles (more for deeper battles and more kills).</p>
    <div class="btns act"><div class="btn" id="back">Back to map</div></div>`, 'shop');
  overlay.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => {
    const u = UPGRADES.find(x => x.id === b.dataset.up);
    const lv = upLvl(u.id), cost = u.base * (lv + 1);
    if (lv >= u.max || save.honor < cost) return;
    save.honor -= cost; save.up[u.id] = lv + 1; writeSave(); sfx(600, 0.12, 'triangle', 0.06, 300);
    showShop(sel);
  }));
  document.getElementById('back').onclick = () => showMap(sel);
}

function statLine(t) { const b = UNITS[t]; return `HP ${b.hp} · DMG ${b.dmg} · ${b.ranged ? 'Range ' + b.range : 'Melee'}`; }
function drawIcons() {
  overlay.querySelectorAll('canvas[data-ic]').forEach(c => {
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    const im = imgs[c.dataset.ic + '_a0']; if (im) x.drawImage(im, 0, 0, FW, FH, 0, 0, FW, FH);
  });
}
function showBarracks(sel, pending) {
  fixLoadout();
  const slots = slotCount();
  let sl = '';
  for (let i = 0; i < slots; i++) {
    const t = save.loadout[i];
    sl += `<div class="slot ${pending ? 'pick' : ''}" data-slot="${i}">${t ? `<canvas data-ic="${t}" width="56" height="32"></canvas><small>${i + 1}. ${UNITS[t].name}</small>` : '<span class="plus">+</span><small>empty</small>'}</div>`;
  }
  const cards = ROSTER.map(t => {
    const b = UNITS[t], own = owned(t), eq = save.loadout.indexOf(t);
    let st, cls;
    if (!own) {
      if (t in KILLS_REQ) { st = `🔒 Unlocks at ${KILLS_REQ[t]} total kills (${Math.min(kills(), KILLS_REQ[t])}/${KILLS_REQ[t]})`; cls = 'locked'; }
      else { st = `💎 ${BUY_COST[t]} treasure: tap to recruit`; cls = save.treasure >= BUY_COST[t] ? 'buy' : 'buy poor'; }
    } else if (eq >= 0) { st = `✔ In squad (slot ${eq + 1}): tap to bench`; cls = 'eq'; }
    else if (pending === t) { st = 'Pick a slot above to replace'; cls = 'pend'; }
    else { st = 'Owned: tap to add to squad'; cls = 'own'; }
    return `<div class="ucard ${cls}" data-u="${t}"><canvas data-ic="${t}" width="56" height="32"></canvas><b>${b.name}</b><small>${statLine(t)}<br>${b.desc}</small><span class="st">${st}</span></div>`;
  }).join('');
  const noteLine = notice ? `<div class="vet" style="color:#7af7e6">${notice}</div>` : ''; notice = '';
  showOverlay(`<h2>Barracks <span style="font-size:.6em;color:#cbb36a">· 💎 ${save.treasure} treasure · ${kills()} kills</span></h2>
    <p class="keys">Your squad (recruit bar): ${slots} slots. ${pending ? '<b style="color:#ffd86b">Choose a slot to replace.</b>' : 'Tap a soldier below to add or bench him. When the bar is full, tap a new one and pick who to replace.'}</p>
    <div class="slots">${sl}</div>${noteLine}
    <div class="grid">${cards}</div>
    <div class="btns act"><div class="btn" id="back">Back to map</div></div>`, 'barracks');
  drawIcons();
  overlay.querySelectorAll('[data-u]').forEach(el => el.onclick = () => {
    const t = el.dataset.u;
    if (!owned(t)) {
      if (t in BUY_COST && save.treasure >= BUY_COST[t]) {
        save.treasure -= BUY_COST[t]; save.bought[t] = true;
        if (save.loadout.length < slots) save.loadout.push(t);
        sfx(660, 0.12, 'triangle', 0.06, 300); checkAch(); writeSave();
      }
      showBarracks(sel); return;
    }
    if (pending === t) { showBarracks(sel); return; }
    const i = save.loadout.indexOf(t);
    if (i >= 0) { if (save.loadout.length > 1) save.loadout.splice(i, 1); writeSave(); showBarracks(sel); }
    else if (save.loadout.length < slots) { save.loadout.push(t); writeSave(); showBarracks(sel); }
    else showBarracks(sel, t);
  });
  overlay.querySelectorAll('[data-slot]').forEach(el => el.onclick = () => {
    if (!pending) return;
    const i = +el.dataset.slot;
    save.loadout[i] = pending; fixLoadout(); writeSave(); showBarracks(sel);
  });
  document.getElementById('back').onclick = () => showMap(sel);
}
function showAch(back) {
  const got = ACH.filter(a => save.ach[a.id]).length;
  const rows = ACH.map(a => { const g = save.ach[a.id]; return `<div class="row" style="${g ? '' : 'opacity:.55'}"><div><b>${g ? '🏆' : '🔒'} ${a.name}</b><small>${a.desc}</small></div><div>${a.reward ? '💎 ' + a.reward : ''}</div></div>`; }).join('');
  const s = save.stats;
  showOverlay(`<h2>Achievements ${got}/${ACH.length}</h2>
    <p class="keys">Kills ${s.kills} · Parries ${s.parries} · Dodges ${s.dodges} · Specials ${s.specials} · Flags ${s.flags} · Generals ${s.gens} · Battles won ${s.wins}</p>
    <div class="shop">${rows}</div><div class="btns act"><div class="btn" id="back">Back</div></div>`, 'ach');
  document.getElementById('back').onclick = back;
}

function endBattle() {
  G.state = 'over';
  const win = G.over === 'win';
  const prevCleared = save.cleared;
  const idx = G.stageIdx, st = G.stage, R = REGIONS[st.region], pow = st.pow;
  for (const t in G.best) if (G.best[t] > (save.legacy[t] || 0)) save.legacy[t] = G.best[t];
  let honor = 0, treasure = 0, tl = [];
  if (win) {
    honor = Math.round(30 + 20 * pow) + G.kills;
    if (idx < prevCleared) honor = Math.floor(honor * 0.5);
    save.cleared = Math.max(save.cleared, idx + 1);
    let tt = pow < 3 ? 2 : pow < 6 ? 3 : pow < 9 ? 4 : 4 + Math.floor((pow - 6) / 4);

(function(){
